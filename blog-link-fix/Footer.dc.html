<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('soren-theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}}catch(e){}})();</script>
<script src="./support.js"></script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'64'%20height%3D'64'%20viewBox%3D'0%200%2064%2064'%3E%3Cg%20transform%3D'translate(32%2032)%20scale(1.32)%20translate(-32%20-32)'%3E%3Cpath%20d%3D'M49.8416%2014.0938C49.8416%2019.0296%2045.8402%2023.031%2040.9042%2023.031H20.7962V27.5017L49.8416%2027.4995L49.8422%2034.202C49.8425%2037.9041%2046.8413%2040.9055%2043.1391%2040.9055H43.1332C43.133%2045.8411%2039.1317%2049.8422%2034.1958%2049.8422H14.0943C14.0943%2044.9066%2018.0957%2040.9055%2023.0315%2040.9055H43.1332V36.4364H14.0943L14.0938%2029.7345C14.0934%2026.0326%2017.0942%2023.0313%2020.7962%2023.031C20.7969%2018.0961%2024.7977%2014.0956%2029.7329%2014.0953L49.8416%2014.0938Z'%20fill%3D'%2356246B'%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
</head>
<body>
<x-dc>
<footer style="{{ footerStyle }}">
  <div style="{{ footerInnerStyle }}">
    <div style="{{ footerTopStyle }}">
      <div style="{{ footerBrandColStyle }}">
        <p style="{{ footerBrandStyle }}">Design for Impact.<br>Shaped by people.</p>
        <div style="{{ footerSocialRowStyle }}">
          <a href="https://www.linkedin.com/company/studio-soren/" style="{{ footerSocialStyle }}" style-hover="color: #8B6CF5;">LinkedIn</a>
          <a href="https://www.instagram.com/studio_soren_uk" style="{{ footerSocialStyle }}" style-hover="color: #8B6CF5;">Instagram</a>
          <a href="https://www.tiktok.com/@studio.soren" style="{{ footerSocialStyle }}" style-hover="color: #8B6CF5;">TikTok</a>
        </div>
      </div>
      <div style="{{ footerColStyle }}">
        <p style="{{ footerHeadStyle }}">Services</p>
        <sc-for list="{{ services }}" as="s" hint-placeholder-count="6">
          <a href="{{ s.href }}" style="{{ footerLinkStyle }}" style-hover="color: #8B6CF5;">{{ s.title }}</a>
        </sc-for>
      </div>
      <div style="{{ footerColStyle }}">
        <p style="{{ footerHeadStyle }}">Case studies</p>
        <sc-for list="{{ caseStudies }}" as="cs" hint-placeholder-count="4">
          <a href="{{ cs.href }}" style="{{ footerLinkStyle }}" style-hover="color: #8B6CF5;">{{ cs.title }}</a>
        </sc-for>
      </div>
      <div style="{{ footerColStyle }}">
        <p style="{{ footerHeadStyle }}">Contact us</p>
        <a href="mailto:hello@studiosoren.com" style="{{ footerLinkStyle }}" style-hover="color: #8B6CF5;">hello@studiosoren.com</a>
        <a href="tel:+447779427031" style="{{ footerLinkStyle }}" style-hover="color: #8B6CF5;">+(44) 777 942 7031</a>
        <p style="{{ footerMetaStyle }}">Remote-first · UK-based</p>
      </div>
    </div>
    <p style="padding-top: 0px; padding-bottom: 12px">Awards &amp; Partners</p>
    <div style="{{ awardsRowStyle }}">
      <a href="https://www.designrush.com/best-designs/apps/carelink-app-design"><img src="{{ awardSrc }}" alt="DesignRush Design Awards Finalist" style="{{ awardImgStyle }}" loading="lazy" decoding="async"></a>
      <a href="https://www.natwest.com/business/business-services/entrepreneur-accelerator.html"><img src="{{ natwestSrc }}" alt="Part of NatWest Accelerator Birmingham" style="{{ natwestImgStyle }}" loading="lazy" decoding="async"></a>
      <a href="https://blackbelt-ai.co.uk/"><img src="{{ bbaiSrc }}" alt="Business partner: Blackbelt AI" style="{{ bbaiImgStyle }}" loading="lazy" decoding="async"></a>
      <a href="https://bigonemarketing.co.uk/"><img src="{{ bigOneSrc }}" alt="Business partner: Big One Marketing" style="{{ bigOneImgStyle }}" loading="lazy" decoding="async"></a>
      <a href="https://proai.co.uk/"><img src="{{ proAiSrc }}" alt="Business partner: Pro AI" style="{{ proAiImgStyle }}" loading="lazy" decoding="async"></a>
    </div>
    <div style="{{ footerBottomStyle }}">
      <p style="{{ footerMetaStyle }}">2026 © All rights reserved.</p>
      <div style="{{ footerSocialRowStyle }}">
        <a href="/cookies-policy" style="{{ footerLinkSmallStyle }}" style-hover="{{ footerLinkSmallHoverStyle }}">Cookies policy</a>
        <a href="/privacy-policy" style="{{ footerLinkSmallStyle }}" style-hover="{{ footerLinkSmallHoverStyle }}">Privacy policy</a>
      </div>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1120,&quot;height&quot;:320},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;services&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{title:string,href:string}&gt;&quot;},&quot;caseStudies&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{title:string,href:string}&gt;&quot;}}">
class Component extends DCLogic {
  state = { viewportWidth: typeof window !== 'undefined' ? window.innerWidth : 1200 };

  componentDidMount() {
    this.onResize = () => this.setState({ viewportWidth: window.innerWidth });
    window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
  }

  defaultServices = [
    { title: 'Research & Data', href: '/service-research-data' },
    { title: 'Web & App Design', href: '/service-product-design' },
    { title: 'AI Integration & Adoption', href: '/service-ai-integration' },
    { title: 'Software Engineering', href: '/service-software-engineering' },
    { title: 'Design Strategy', href: '/service-design-strategy' },
    { title: 'Digital Storytelling', href: '/service-digital-storytelling' },
  ];

  defaultCaseStudies = [
    { title: "BT's digital checkout", href: '/case-study-bt' },
    { title: "Mind's graduate onboarding", href: '/case-study-mind' },
    { title: 'KEYS Community', href: '/case-study-keys' },
    { title: 'The CareLink App', href: '/case-study-carelink' },
  ];

  renderVals() {
    const dark = this.props.dark ?? true;
    const fontDisplay = "'Filson Soft', 'Fraunces', Georgia, serif";
    const fontBody = "'DM Sans', -apple-system, sans-serif";
    const vw = this.state.viewportWidth;
    const isNarrow = vw < 640;
    const isMobile = vw < 860;

    const bg = dark ? '#0C0A12' : '#FAF9FC';
    const heading = dark ? '#fff' : '#171325';
    const text = dark ? '#C7BEDC' : '#4A4458';
    const muted = dark ? '#8A80A3' : '#8A8398';
    const border = dark ? 'rgba(255,255,255,0.08)' : 'rgba(20,15,35,0.1)';
    const accent = '#8B6CF5';

    return {
      footerStyle: { background: bg, color: text, padding: isNarrow ? '48px 20px 28px' : '64px 24px 32px' },
      footerInnerStyle: { maxWidth: '1120px', margin: '0 auto' },
      footerTopStyle: { display: 'grid', gridTemplateColumns: isNarrow ? '1fr' : isMobile ? '1fr 1fr' : '1.4fr 1fr 1fr 1fr', gap: isNarrow ? '28px' : '32px', paddingBottom: isNarrow ? '32px' : '40px' },
      footerBrandColStyle: {},
      footerBrandStyle: { fontFamily: fontDisplay, fontSize: '20px', color: heading, margin: '0 0 20px' },
      footerSocialRowStyle: { display: 'flex', gap: '16px', flexWrap: 'wrap' },
      footerSocialStyle: { color: text, textDecoration: 'none', fontSize: '13px', transition: 'color .15s ease' },
      footerColStyle: { display: 'flex', flexDirection: 'column', gap: '10px' },
      footerHeadStyle: { fontFamily: fontBody, fontWeight: 700, fontSize: '12px', textTransform: 'uppercase', letterSpacing: '0.04em', color: muted, margin: '0 0 4px' },
      footerLinkStyle: { color: text, textDecoration: 'none', fontSize: '13px', transition: 'color .15s ease' },
      footerLinkHoverStyle: { color: accent },
      footerLinkSmallStyle: { color: muted, textDecoration: 'none', fontSize: '12px', transition: 'color .15s ease' },
      footerLinkSmallHoverStyle: { color: text },
      footerMetaStyle: { color: muted, fontSize: '12px', margin: '4px 0 0' },
      awardsRowStyle: { display: 'flex', alignItems: 'center', gap: isNarrow ? '20px' : '28px', flexWrap: 'wrap', paddingBottom: '32px', opacity: 0.85, filter: dark ? 'none' : 'brightness(0.75)' },
      awardSrc: (window.__resources && window.__resources.bdaFinalist) || './uploads/bda-finalist.png',
      natwestSrc: (window.__resources && window.__resources.natwest) || './uploads/pasted-1785937780547-0.png',
      bbaiSrc: (window.__resources && window.__resources.bbai) || './uploads/blackbelt-ai-logo-cropped.png',
      bigOneSrc: (window.__resources && window.__resources.bigOne) || './uploads/pasted-1785955929954-0.png',
      proAiSrc: (window.__resources && window.__resources.proAi) || './uploads/pasted-1786096509862-0.png',
      awardImgStyle: { height: isNarrow ? '40px' : '52px', width: 'auto', display: 'block' },
      natwestImgStyle: { height: isNarrow ? '26px' : '32px', width: 'auto', display: 'block', borderRadius: '4px' },
      bbaiImgStyle: { height: isNarrow ? '22px' : '28px', width: 'auto', display: 'block' },
      bigOneImgStyle: { height: isNarrow ? '26px' : '32px', width: 'auto', display: 'block' },
      proAiImgStyle: { height: isNarrow ? '26px' : '32px', width: 'auto', display: 'block' },
      footerBottomStyle: { display: 'flex', justifyContent: 'space-between', alignItems: isNarrow ? 'flex-start' : 'center', flexDirection: isNarrow ? 'column' : 'row', borderTop: `1px solid ${border}`, paddingTop: '24px', flexWrap: 'wrap', gap: '12px' },

      services: this.props.services ?? this.defaultServices,
      caseStudies: this.props.caseStudies ?? this.defaultCaseStudies,
    };
  }
}
</script>
</body>
</html>
