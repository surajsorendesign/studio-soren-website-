<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  blocks = [
    { type: 'p', text: 'For many of us, "digital transformation" sounds like a success story — faster apps, sleeker websites, and everything at our fingertips. But for someone living with a disability in the UK today, that "fingertip" access can feel more like a locked door.' },
    { type: 'p', text: 'As the cost of living continues to bite, the safety net many relied on is changing. People who once qualified for Personal Independence Payment (PIP) — a payment designed to cover the extra costs of living with a disability — are increasingly finding themselves "zero-rated" or ineligible. When that money stops, the risk of spiralling into debt isn\'t just a possibility; it\'s an immediate reality.' },
    { type: 'h3', text: 'The Human Reality: PIP vs. Universal Credit' },
    { type: 'p', text: "Imagine losing £400 a month while the price of heating your home and buying specialised food is rising. That is the reality for those losing PIP. Many are then told to rely on Universal Credit (UC), but the two systems couldn't feel more different:" },
    { type: 'list', items: ["The Jobcentre (The Human Factor): Traditionally, the Jobcentre was a place where you could speak to a human. While it wasn't perfect, a Work Coach could see when you were struggling, hear your voice, and offer a bit of flexibility.", 'Universal Credit (The Digital Portal): UC is a "digital-first" system. Most communication happens through an online journal. For someone with a visual impairment, chronic fatigue, or cognitive struggles, "just logging in" can be a daily mountain to climb. If you miss a notification because the website was confusing, you risk being "sanctioned" — having your money cut off entirely.'] },
    { type: 'h3', text: 'What is the "Gold Standard" for Digital Services?' },
    { type: 'p', text: 'In the world of government websites, we talk about GDS (Government Digital Service) standards. Specifically, a level called WCAG 2.1 AA.' },
    { type: 'p', text: 'Think of AA compliance as the "Gold Standard" for a ramp into a building. If a website is AA-compliant, it means it\u2019s built so that screen readers can read it, the colours are easy to see, and it\u2019s simple to navigate with just a keyboard. This isn\'t just a "nice to have" — it\u2019s a legal requirement. It ensures that the digital world doesn\'t exclude the very people who need it most.' },
    { type: 'h3', text: 'How Public Servants Can Help: Upskilling for Empathy' },
    { type: 'p', text: 'If you work in public service, you aren\'t just a "processor" — you are a navigator. Here is how you can upskill to make these journeys better for claimants:' },
    { type: 'p', text: 'Understand "Pain Points": A pain point is a moment in a journey where a user feels frustrated or stuck. For a UC claimant, a pain point might be a complex form that doesn\'t save their progress.' },
    { type: 'p', text: "Learn Accessibility Basics: You don't need to be a coder. Free courses on accessibility help you understand how disabled people use the web." },
    { type: 'p', text: 'Advocate for the User: If you see a claimant struggling with the digital portal, record that feedback. Public services improve only when the "frontline" staff highlight where the "back office" systems are failing.' },
    { type: 'h3', text: 'Conclusion: Designing for Dignity' },
    { type: 'p', text: 'At the end of every digital journal entry or PIP assessment is a person trying to keep their head above water. Digital systems should be tools that empower us, not hurdles that trip us up. By sticking to high accessibility standards and keeping a "human-first" mindset, we can ensure that "digital-first" doesn\'t mean "people-last."' },
  ];

  }
}
