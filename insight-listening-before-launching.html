<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<template id="__bundler_thumbnail" data-bg-color="#0C0A12">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <circle cx="50" cy="50" r="34" fill="#8B6CF5"/>
  <text x="50" y="62" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#0C0A12" text-anchor="middle">S</text>
</svg>

<dc-import name="ArticleDetail" title="{{ title }}" category="{{ category }}" person="{{ person }}" date="{{ date }}" minutes="{{ minutes }}" image="{{ image }}" image-alt="{{ imageAlt }}" dc-props="{{ extraProps }}" hint-size="100%,2000px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  blocks = [
    { type: 'h3', text: 'How designing with communities, not for them, leads to safer, more trusted services' },
    { type: 'p', text: 'In the third sector, good intentions are never in short supply. What\u2019s harder to achieve is clarity, especially when the systems we design are meant to support people at moments of stress, uncertainty or vulnerability.' },
    { type: 'p', text: 'Too often, services are launched to communities rather than with them. And while the aim may be positive, the result can be confusion, low uptake or unintended harm. Co-design offers a gentler, more effective path forward — one rooted in listening before acting.' },
    { type: 'h3', text: 'Why Listening Comes First' },
    { type: 'p', text: 'At Studio Soren, we see listening as an act of care. It\u2019s a principle rooted in our belief to listen first, design second.' },
    { type: 'p', text: 'Before a single screen is designed or a process mapped, we begin with user research, not as a box ticking exercise, but as a way to understand lived experience. For charities and non-profits, this means creating space for people to share where systems feel heavy, unclear or intimidating — often described as pain points:' },
    { type: 'list', items: ['A form that feels overwhelming when energy is already low.', 'A service handover where no one is quite sure what happens next.', 'Language that unintentionally excludes or confuses.'] },
    { type: 'p', text: 'By listening carefully, patterns emerge. And with clarity, teams can focus on what truly matters — supporting people.' },
    { type: 'h3', text: 'Co-Design as a Form of Service' },
    { type: 'p', text: 'Co-design is sometimes misunderstood as "asking users what they want." In reality, it\u2019s about working alongside communities to shape safer, more trusted services. Equity and dignity must sit at the heart of design work.' },
    { type: 'p', text: 'Through facilitated workshops, a core part of our service design practice, charities can bring together:' },
    { type: 'list', items: ['People with lived experience.', 'Frontline staff.', 'Service managers and decision makers.'] },
    { type: 'p', text: 'Using service design methods, these groups can explore challenges together, surface assumptions and imagine better ways of working. This collaborative space often leads to small but meaningful insights — changes that reduce friction, improve dignity and build trust.' },
    { type: 'p', text: 'Importantly, co-design also supports teams internally. It creates shared understanding, breaks down silos and fosters a growth mindset where learning is continuous rather than fixed.' },
    { type: 'h3', text: 'From Insight to Action: Blueprinting Better Services' },
    { type: 'p', text: 'Listening matters, but it\u2019s what we do with what we hear that makes the difference.' },
    { type: 'p', text: 'Service design helps teams move from insight to understanding. One of the ways we do this is through service blueprinting — a calm, shared way of looking at how a service really works.' },
    { type: 'p', text: 'A blueprint lays out the journey from a person\u2019s point of view, alongside the quieter work happening behind the scenes. When teams see both together, it becomes easier to notice where experiences don\u2019t quite match intentions. For charities and non-profits, this often helps to:' },
    { type: 'list', items: ["Uncover gaps between what people experience and how services are delivered.", 'Spot repeated steps, delays or unnecessary effort that drain time and energy.', 'Create a shared picture teams can return to when things feel complex or unclear.'] },
    { type: 'p', text: "Blueprints don't need to be polished or perfect. Their real value is in making the invisible visible, so decisions can be made with care and improvements come from understanding rather than assumption." },
    { type: 'h3', text: 'Designing Together' },
    { type: 'p', text: 'Every project is an opportunity to learn. When charities, designers and communities grow together, the result is not just better services, but stronger relationships.' },
    { type: 'p', text: 'By approaching design as a collaborative act of listening, reflection and shared problem solving, the third sector can build systems that are not only functional, but kind.' },
    { type: 'p', text: 'And in work like this, kindness is not a soft extra. It\u2019s the foundation.' },
  ];

  renderVals() {
    return {
      title: 'Listening before launching: Why co-design matters in the third sector',
      category: 'Design Strategy',
      person: 'umay-hussain',
      date: '2026-02-05T00:00:00.000Z',
      minutes: '2',
      image: 'https://framerusercontent.com/images/zxFhSDDzk7pv0oepgdBJIFQOz70.jpg',
      imageAlt: 'Group therapy meeting',
      extraProps: { blocks: this.blocks },
    };
  }
}
</script>
</body>
</html>
