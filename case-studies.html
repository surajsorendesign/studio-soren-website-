<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="https://t.contentsquare.net/uxa/9766b7092233a.js" defer></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-M8FPC24GCR"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-M8FPC24GCR');
</script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Filson Soft'; src: url('./uploads/FilsonSoft-Bold.woff') format('woff'); font-weight: 100 900; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Filson Soft'; src: url('./uploads/FilsonSoft-Bold.woff') format('woff'); font-weight: 100 900; font-style: italic; font-display: swap; }
  * { box-sizing: border-box; }
  body { margin: 0; -webkit-font-smoothing: antialiased; }
  a { color: #8B6CF5; }
  a:hover { color: #A78BFA; }
</style>
</helmet>

<div style="{{ pageStyle }}">
  <dc-import name="Nav" active="case-studies" dark="{{ true }}" hint-size="100%,64px"></dc-import>

  <header style="{{ heroSectionStyle }}">
    <p style="{{ eyebrowStyle }}">Case studies</p>
    <h1 style="{{ h1Style }}">Real work, real impact</h1>
    <p style="{{ heroSubStyle }}">Digital products and services we've shaped for public sector, charity, and commercial partners.</p>
  </header>

  <section style="{{ sectionStyle }}">
    <div style="{{ gridStyle }}">
      <sc-for list="{{ caseStudies }}" as="cs" hint-placeholder-count="6">
        <a href="{{ cs.href }}" style="{{ cardStyle }}">
          <div style="{{ cardImgWrapStyle }}"><img src="{{ cs.hero }}" style="{{ cardImgStyle }}" alt="{{ cs.title }}"/></div>
          <div style="{{ cardBodyStyle }}">
            <span style="{{ cardTagStyle }}">{{ cs.sector }}</span>
            <h3 style="{{ cardTitleStyle }}">{{ cs.title }}</h3>
            <p style="{{ cardStatStyle }}">{{ cs.cardStat }}</p>
            <span style="{{ cardLinkStyle }}">Read case study →</span>
          </div>
        </a>
      </sc-for>
    </div>
  </section>

  <dc-import name="Footer" dark="{{ true }}" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { viewportWidth: typeof window !== 'undefined' ? window.innerWidth : 1200 };

  componentDidMount() {
    this.updateViewport = () => this.setState({ viewportWidth: window.innerWidth });
    window.addEventListener('resize', this.updateViewport);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.updateViewport);
  }

  caseStudies = [
    { slug: 'bt', title: "BT's digital checkout", sector: 'Commercial', cardStat: 'Increased conversion', hero: 'https://framerusercontent.com/images/DoUEU9ODoRe40yWRYcbewVSUgI.png', href: './Studio Soren Case Study - BT Digital Checkout.dc.html' },
    { slug: 'mind', title: "Mind's graduate onboarding", sector: 'Charity', cardStat: 'Increased retention', hero: 'https://framerusercontent.com/images/KMpil3YTapxJcllz8veRCoa8Fs.png', href: './Studio Soren Case Study - Mind Onboarding.dc.html' },
    { slug: 'keys', title: 'KEYS Community', sector: 'Commercial', cardStat: 'Increase in LinkedIn followers', hero: 'https://framerusercontent.com/images/9hitZPZgRsu0ExlX0tphm2g5SUU.png', href: './Studio Soren Case Study - KEYS Community.dc.html' },
    { slug: 'carelink', title: 'The CareLink App', sector: 'Commercial', cardStat: 'Vulnerable customers impacted', hero: 'https://framerusercontent.com/images/QwpLpXr9YPXzM2tlteONSmAUhRA.png', href: './Studio Soren Case Study - CareLink App.dc.html' },
    { slug: 'ee', title: 'EE Retail Kiosk Experience', sector: 'Commercial', cardStat: 'Investment saved', hero: 'https://framerusercontent.com/images/5fgUxbHqDJOl5fSZkUOQRqbl3Y.png', href: './Studio Soren Case Study - EE Retail Kiosk.dc.html' },
    { slug: 'kindred', title: 'Kindred', sector: 'Non-profit', cardStat: 'Longer cognitive baseline', hero: 'https://framerusercontent.com/images/od365oMvoBfcynUpwSBTyoXnHks.png', href: './Studio Soren Case Study - Kindred.dc.html' },
  ];

  renderVals() {
    const isMobile = this.state.viewportWidth < 860;
    const isNarrow = this.state.viewportWidth < 680;
    const accent = '#8B6CF5', bg = '#0C0A12', cardBg = 'rgba(255,255,255,0.04)', border = 'rgba(255,255,255,0.1)', text = '#F3F1F9', muted = '#A69FBE';
    const fontDisplay = "'Filson Soft', 'Fraunces', Georgia, serif", fontBody = "'DM Sans', -apple-system, sans-serif";
    return {
      pageStyle: { background: bg, color: text, fontFamily: fontBody, minHeight: '100vh', paddingTop: '24px' },
      navWrapStyle: { position: 'sticky', top: '24px', zIndex: 50, display: 'flex', justifyContent: 'center', padding: '0 16px' },
      navInnerStyle: { display: 'flex', alignItems: 'center', gap: '28px', width: '100%', maxWidth: '1120px', padding: '12px 20px', borderRadius: '999px', background: 'rgba(20,16,32,0.65)', backdropFilter: 'blur(18px)', border: `1px solid ${border}` },
      logoLinkStyle: { display: 'flex', alignItems: 'center', marginRight: 'auto', textDecoration: 'none' },
      logoImgStyle: { height: '30px', width: 'auto', filter: 'brightness(0) invert(1)' },
      navLinksStyle: { display: 'flex', gap: '24px', flexWrap: 'wrap' },
      navLinkStyle: { color: muted, textDecoration: 'none', fontSize: '14px', fontWeight: 500 },
      navLinkActiveStyle: { color: accent, textDecoration: 'none', fontSize: '14px', fontWeight: 700 },
      navCtaStyle: { background: accent, color: '#fff', textDecoration: 'none', padding: '10px 18px', borderRadius: '999px', fontSize: '14px', fontWeight: 600, whiteSpace: 'nowrap' },
      heroSectionStyle: { padding: '72px 24px 40px', maxWidth: '820px', margin: '0 auto', textAlign: 'center' },
      eyebrowStyle: { fontWeight: 600, fontSize: '13px', letterSpacing: '0.04em', color: accent, margin: '0 0 16px', textTransform: 'uppercase' },
      h1Style: { fontFamily: fontDisplay, fontSize: '46px', lineHeight: 1.1, fontWeight: 700, margin: '0 0 16px' },
      heroSubStyle: { fontSize: '18px', lineHeight: 1.6, color: muted, margin: 0 },
      sectionStyle: { padding: '40px 24px 100px', maxWidth: '1120px', margin: '0 auto' },
      gridStyle: { display: 'grid', gridTemplateColumns: isNarrow ? '1fr' : isMobile ? 'repeat(2, 1fr)' : 'repeat(3, 1fr)', gap: '20px' },
      cardStyle: { textDecoration: 'none', color: text, background: cardBg, border: `1px solid ${border}`, borderRadius: '18px', overflow: 'hidden', display: 'flex', flexDirection: 'column' },
      cardImgWrapStyle: { aspectRatio: '4/3', overflow: 'hidden' },
      cardImgStyle: { width: '100%', height: '100%', objectFit: 'cover', display: 'block' },
      cardBodyStyle: { padding: '22px 24px 26px', display: 'flex', flexDirection: 'column', gap: '6px' },
      cardTagStyle: { fontWeight: 700, fontSize: '11px', color: accent, textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: '4px' },
      cardTitleStyle: { fontSize: '18px', fontWeight: 700, margin: 0 },
      cardStatStyle: { fontSize: '13px', color: muted, margin: '0 0 8px' },
      cardLinkStyle: { fontSize: '13px', fontWeight: 600, color: text },
      caseStudies: this.caseStudies,
    };
  }
}
</script>
</body>
</html>
