<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('soren-theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}}catch(e){}})();</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="https://t.contentsquare.net/uxa/9766b7092233a.js" defer></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-M8FPC24GCR"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-M8FPC24GCR');
</script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Filson Soft'; src: url('./uploads/FilsonSoft-Bold.woff') format('woff'); font-weight: 100 900; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Filson Soft'; src: url('./uploads/FilsonSoft-Bold.woff') format('woff'); font-weight: 100 900; font-style: italic; font-display: swap; }
  * { box-sizing: border-box; }
  /* anti-flash */
  html.sc-dc-streaming .sc-placeholder::before,
  html.sc-dc-streaming .sc-interp.sc-missing::before { animation: none !important; background: none !important; }
  .sc-placeholder[title="Nav"], .sc-placeholder[title="Footer"] { background: transparent !important; border: none !important; }
  html, body { background: #0C0A12; }
  html[data-theme="light"], html[data-theme="light"] body { background: #FAF9FC; }
  @keyframes soren-page-in { from { opacity: 0; } to { opacity: 1; } }
  body { margin: 0; -webkit-font-smoothing: antialiased; }
  a { color: #8B6CF5; }
  a:hover { color: #A78BFA; }
</style>
</helmet>

<div style="{{ pageStyle }}">
  <dc-import name="Nav" active="insights" dark="{{ dark }}" on-theme-change="{{ toggleTheme }}" hint-size="100%,64px"></dc-import>

  <header style="{{ heroSectionStyle }}">
    <span style="{{ tagStyle }}">{{ props.category }}</span>
    <h1 style="{{ h1Style }}">{{ props.title }}</h1>
    <div style="{{ metaRowStyle }}">
      <span>{{ props.personLabel }}</span>
      <span style="{{ dotStyle }}">•</span>
      <span>{{ props.dateLabel }}</span>
      <span style="{{ dotStyle }}">•</span>
      <span>{{ props.minutes }} minute read</span>
    </div>
    <img src="{{ props.image }}" style="{{ heroImgStyle }}" alt="{{ props.imageAlt }}"/>
  </header>

  <article style="{{ articleSectionStyle }}">
    <div style="{{ narrowStyle }}">
      <sc-for list="{{ props.blocks }}" as="b" hint-placeholder-count="12">
        <sc-if value="{{ b.isH2 }}" hint-placeholder-val="{{ false }}"><h2 style="{{ h2Style }}">{{ b.text }}</h2></sc-if>
        <sc-if value="{{ b.isH3 }}" hint-placeholder-val="{{ false }}"><h3 style="{{ h3Style }}">{{ b.text }}</h3></sc-if>
        <sc-if value="{{ b.isQuote }}" hint-placeholder-val="{{ false }}"><blockquote style="{{ quoteStyle }}">{{ b.text }}</blockquote></sc-if>
        <sc-if value="{{ b.isP }}" hint-placeholder-val="{{ false }}"><p style="{{ paraStyle }}">{{ b.text }}</p></sc-if>
        <sc-if value="{{ b.isList }}" hint-placeholder-val="{{ false }}">
          <ul style="{{ listStyle }}">
            <sc-for list="{{ b.items }}" as="li" hint-placeholder-count="3">
              <li style="{{ listItemStyle }}">{{ li }}</li>
            </sc-for>
          </ul>
        </sc-if>
      </sc-for>
    </div>
  </article>

  <section style="{{ backRowSectionStyle }}">
    <div style="{{ narrowStyle }}">
      <a href="./insights.html" style="{{ backLinkStyle }}">← Back to all insights</a>
    </div>
  </section>

  <section style="{{ inquirySectionStyle }}">
    <div style="{{ inquiryInnerStyle }}">
      <h2 style="{{ inquiryHeadStyle }}">Want to talk through what this means for your organisation?</h2>
      <button onClick="{{ openModal }}" style="{{ primaryBtnStyle }}" style-hover="transform: scale(1.05); box-shadow: 0 10px 32px rgba(139,108,245,0.55);">Discuss a project</button>
    </div>
  </section>

  <dc-import name="Footer" dark="{{ dark }}" hint-size="100%,320px"></dc-import>
  <dc-import name="DiscussProjectModal" open="{{ modalOpen }}" on-close="{{ closeModal }}" dark="{{ dark }}" hint-size="100%,100%"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:1200},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Article title&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;category&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Design Strategy&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;person&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;suraj-soren&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;date&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;minutes&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;5&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;image&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;imageAlt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;blocks&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[],&quot;tsType&quot;:&quot;Array&lt;{type:string,text?:string,items?:string[]}&gt;&quot;}}">
class Component extends DCLogic {
  theme0 = (typeof localStorage !== 'undefined' && localStorage.getItem('soren-theme') === 'light') ? 'light' : 'dark';
  toggleTheme = () => { this.setState((s) => { const next = (s.theme || this.theme0) === 'dark' ? 'light' : 'dark'; if (typeof localStorage !== 'undefined') localStorage.setItem('soren-theme', next); return { theme: next }; }); };
  state = { modalOpen: false };
  openModal = () => this.setState({ modalOpen: true });
  closeModal = () => this.setState({ modalOpen: false });

  renderVals() {
    const dark = (this.state.theme || this.theme0) !== 'light';
    const accent = '#8B6CF5', bg = dark ? '#0C0A12' : '#FAF9FC', cardBg = dark ? 'rgba(255,255,255,0.04)' : '#FFFFFF', border = dark ? 'rgba(255,255,255,0.1)' : 'rgba(20,15,35,0.08)', text = dark ? '#F3F1F9' : '#171325', muted = dark ? '#A69FBE' : '#635C77';
    const fontDisplay = "'Filson Soft', 'Fraunces', Georgia, serif", fontBody = "'DM Sans', -apple-system, sans-serif";
    const personNames = { 'umay-hussain': 'Umay Hussain', 'suraj-soren': 'Suraj Soren' };
    const p = this.props || {};
    const dateLabel = p.date ? new Date(p.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
    const blocks = (p.blocks || []).map((b) => ({
      ...b,
      isH2: b.type === 'h2',
      isH3: b.type === 'h3' || b.type === 'h4',
      isQuote: b.type === 'quote',
      isP: b.type === 'p',
      isList: b.type === 'list',
    }));

    return {
      dark,
      toggleTheme: this.toggleTheme,
      pageStyle: { animation: 'soren-page-in .5s ease both', background: bg, color: text, fontFamily: fontBody, minHeight: '100vh', paddingTop: '24px' },
      heroSectionStyle: { padding: '72px 24px 0', maxWidth: '820px', margin: '0 auto', textAlign: 'center', display: 'flex', flexDirection: 'column', alignItems: 'center' },
      tagStyle: { fontWeight: 700, fontSize: '12px', color: accent, textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: '16px' },
      h1Style: { fontFamily: fontDisplay, fontSize: '40px', lineHeight: 1.15, fontWeight: 700, margin: '0 0 20px' },
      metaRowStyle: { display: 'flex', alignItems: 'center', gap: '10px', color: muted, fontSize: '14px', marginBottom: '32px' },
      dotStyle: { color: muted },
      heroImgStyle: { width: '100%', maxWidth: '1120px', borderRadius: '20px', display: 'block' },
      articleSectionStyle: { padding: '56px 24px 24px' },
      narrowStyle: { maxWidth: '720px', margin: '0 auto' },
      h2Style: { fontFamily: fontDisplay, fontSize: '26px', lineHeight: 1.3, fontWeight: 700, margin: '40px 0 16px' },
      h3Style: { fontFamily: fontDisplay, fontSize: '21px', lineHeight: 1.35, fontWeight: 700, margin: '32px 0 14px' },
      paraStyle: { fontSize: '16px', lineHeight: 1.8, color: muted, margin: '0 0 18px' },
      quoteStyle: { fontFamily: fontDisplay, fontSize: '19px', lineHeight: 1.5, color: text, borderLeft: `3px solid ${accent}`, margin: '24px 0', padding: '4px 0 4px 20px' },
      listStyle: { margin: '0 0 18px', padding: '0 0 0 20px' },
      listItemStyle: { fontSize: '16px', lineHeight: 1.8, color: muted, marginBottom: '8px' },
      backRowSectionStyle: { padding: '0 24px 56px' },
      backLinkStyle: { color: accent, textDecoration: 'none', fontSize: '14px', fontWeight: 600 },
      inquirySectionStyle: { padding: '90px 24px', background: '#171225', color: '#fff', textAlign: 'center' },
      inquiryInnerStyle: { maxWidth: '640px', margin: '0 auto', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '24px' },
      inquiryHeadStyle: { fontFamily: fontDisplay, fontSize: '30px', fontWeight: 700, margin: 0, color: '#fff' },
      primaryBtnStyle: { background: accent, color: '#fff', textDecoration: 'none', padding: '14px 26px', borderRadius: '999px', fontSize: '15px', fontWeight: 600, cursor: 'pointer', transition: 'transform .2s ease, box-shadow .2s ease' },
      primaryBtnHoverStyle: { transform: 'scale(1.05)', boxShadow: '0 10px 32px rgba(139,108,245,0.55)' },
      modalOpen: this.state.modalOpen, openModal: this.openModal, closeModal: this.closeModal,
      props: { ...p, blocks, personLabel: personNames[p.person] || p.person, dateLabel },
    };
  }
}
</script>
</body>
</html>
