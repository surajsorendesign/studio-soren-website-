<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){try{var t=localStorage.getItem('soren-theme');if(t==='dark'||t==='light'){document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}}catch(e){}})();</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ badgeWrapStyle }}">
  <img src="./uploads/founder-suraj.webp" alt="Suraj Soren" style="{{ badgeImgStyle }}"/>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:340},&quot;maxWidth&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;220&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    let maxWidth = this.props.maxWidth || '220px';
    if (/^\d+$/.test(String(maxWidth))) maxWidth = `${maxWidth}px`;
    return {
      badgeWrapStyle: { position: 'relative', width: '100%', maxWidth, aspectRatio: '1/1', flexShrink: 0 },
      badgeImgStyle: { width: '100%', height: '100%', display: 'block', objectFit: 'cover', borderRadius: '999px', filter: 'drop-shadow(0 18px 34px rgba(0,0,0,0.4))' },
    };
  }
}
</script>
</body>
</html>
