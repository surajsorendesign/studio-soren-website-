<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  blocks = [
    { type: 'h2', text: 'Digital transformation is often described as a technology challenge.' },
    { type: 'h3', text: 'New platforms. New systems. New tools. New processes.' },
    { type: 'p', text: 'But in practice, the success of digital transformation rarely depends on technology alone. More often, it depends on people, how teams communicate, how organisations learn and how trust is built over time.' },
    { type: 'p', text: 'At Studio Soren, a growth mindset is one of our core values because we believe meaningful digital change only happens when people are willing to learn together, adapt together and improve together.' },
    { type: 'p', text: 'That includes us.' },
    { type: 'p', text: 'We do not see ourselves as a vendor delivering work from a distance. We see ourselves as long-term partners, working alongside organisations to navigate complexity with clarity, care and shared accountability.' },
    { type: 'p', text: 'For mission-driven organisations especially, this matters. Whether you are a charity, public sector team, social enterprise or service provider, digital transformation often affects the people you support, the teams delivering services and the trust your organisation has built over many years.' },
    { type: 'p', text: 'A growth mindset helps make that change more human, collaborative and sustainable.' },
    { type: 'h2', text: 'What We Mean by Growth Mindset' },
    { type: 'p', text: 'Growth mindset is often simplified into the idea of "continuous improvement."' },
    { type: 'p', text: 'But for us, it means something deeper.' },
    { type: 'p', text: 'The concept originates from the work of Carol Dweck, who identified that people and organisations tend to operate from either a fixed mindset (believing abilities are largely set) or a growth mindset, which sees skills, knowledge and outcomes as things that can be developed through learning, effort and reflection.' },
    { type: 'p', text: 'At Studio Soren, we believe the best digital work is built from that perspective.' },
    { type: 'p', text: 'It means recognising that meaningful transformation is rarely achieved through perfection on day one. Instead, it emerges through learning, reflection, collaboration and iteration.' },
    { type: 'p', text: "Whether we're designing a new service, improving a user journey, or supporting organisational change, we approach challenges with curiosity rather than certainty. We test ideas, learn from feedback and adapt as we go." },
    { type: 'p', text: 'It means:' },
    { type: 'list', items: ['Being open to feedback', 'Creating space for honest conversations', 'Learning from challenges instead of hiding them', 'Improving systems and ways of working over time', 'Taking accountability without blame', 'Building trust through transparency', 'Designing with people, not simply for them'] },
    { type: 'p', text: 'A growth mindset creates healthier partnerships because it removes the pressure to appear perfect and instead focuses on making meaningful progress together.' },
    { type: 'h2', text: 'Long-Term Partnerships Are Built on Trust' },
    { type: 'p', text: 'Many organisations have experienced digital projects that felt transactional.' },
    { type: 'p', text: 'An agency delivers a product, hands it over and moves on. But meaningful digital transformation does not work that way.' },
    { type: 'p', text: 'Real change takes time. Teams evolve. Services shift. User needs change. Internal pressures emerge. New challenges appear after launch.' },
    { type: 'p', text: 'That is why we focus on building long-term relationships rather than short-term delivery cycles.' },
    { type: 'p', text: 'Trust is central to that process. Not only trust between us and our clients, but trust between organisations and the people they serve.' },
    { type: 'p', text: 'When users trust a service, they are more likely to engage with it confidently.' },
    { type: 'p', text: 'When internal teams trust one another, collaboration improves.' },
    { type: 'p', text: 'When leadership teams trust the process, decisions become clearer and more sustainable.' },
    { type: 'p', text: 'Trust grows when people feel heard, involved and respected throughout the work.' },
    { type: 'h2', text: 'Co-Creation Leads to Better Outcomes' },
    { type: 'p', text: 'One of the ways we build trust is through co-creation.' },
    { type: 'p', text: 'We regularly run collaborative workshops and co-create sessions with both clients and users because we believe the best solutions emerge through shared understanding.' },
    { type: 'p', text: 'Too often, digital products are designed around assumptions.' },
    { type: 'p', text: 'Co-creation creates space for people to contribute meaningfully to the design process, helping organisations move beyond assumptions and make decisions based on real experiences.' },
    { type: 'p', text: 'Depending on the challenge, this might include:' },
    { type: 'list', items: ['In-person workshops that bring together stakeholders, frontline teams, and service users to align on goals, challenges, and opportunities.', 'Continuous Discovery practices that create regular feedback loops with users, ensuring products evolve alongside real needs rather than assumptions.', 'User interviews that uncover behaviours, motivations, frustrations, and unmet needs that data alone cannot reveal.', 'Insight and Opportunity Card Sorting exercises that help teams identify patterns, prioritise opportunities, and build shared understanding around what matters most.', 'Journey mapping sessions that visualise user experiences across a service and highlight moments of friction, confusion, or opportunity.', 'Collaborative prioritisation workshops that help teams align on where to focus effort and investment for the greatest impact.'] },
    { type: 'p', text: 'These activities are not simply research exercises. They are opportunities to build trust, create shared ownership and bring different perspectives into the room.' },
    { type: 'p', text: 'When people feel heard and involved, organisations gain deeper insight, teams build stronger alignment and the resulting products and services are more likely to meet genuine user needs.' },
    { type: 'p', text: 'This approach often reduces long-term project risks because teams uncover misunderstandings and unmet needs earlier in the process. It also leads to stronger adoption because people are more likely to trust services they helped shape.' },
    { type: 'h2', text: 'Everyone Is Doing Their Best' },
    { type: 'p', text: 'One of the beliefs that shapes our work is simple:' },
    { type: 'p', text: 'Most people are trying their best within the systems they are working in.' },
    { type: 'p', text: 'When projects struggle, the problem is rarely that individuals do not care.' },
    { type: 'p', text: 'More often, challenges emerge from:' },
    { type: 'list', items: ['Miscommunication', 'Unclear priorities', 'Fragmented systems', 'Limited capacity', 'Conflicting pressures', 'Lack of shared understanding', 'Processes that no longer support teams effectively'] },
    { type: 'p', text: 'This perspective matters because it changes how organisations approach problem-solving.' },
    { type: 'p', text: 'Blame creates defensiveness. Curiosity creates learning.' },
    { type: 'p', text: 'When teams assume positive intent, they are more likely to uncover the real causes of friction and work together constructively.' },
    { type: 'p', text: 'That does not mean avoiding accountability. Accountability matters deeply in digital transformation.' },
    { type: 'p', text: 'But accountability works best when it focuses on learning and improvement rather than fear.' },
    { type: 'p', text: 'Healthy digital teams create environments where people can identify problems early, discuss challenges honestly, and adapt together.' },
    { type: 'h2', text: 'Why Communication Often Becomes the Real Challenge' },
    { type: 'p', text: 'In many digital transformation projects, communication becomes more difficult as complexity grows.' },
    { type: 'p', text: 'Different departments use different languages. Technical teams and service teams may approach problems differently. Stakeholders can have competing priorities.' },
    { type: 'p', text: 'Without shared understanding, projects become harder to manage.' },
    { type: 'p', text: 'This is why strategic facilitation and collaborative working practices matter so much.' },
    { type: 'p', text: 'We spend significant time helping teams:' },
    { type: 'list', items: ['Clarify goals', 'Align expectations', 'Translate complexity into plain language', 'Improve visibility across teams', 'Reduce ambiguity'] },
    { type: 'p', text: 'Clear communication reduces unnecessary friction.' },
    { type: 'p', text: 'It also reduces long-term costs because teams spend less time revisiting decisions, resolving misunderstandings, or rebuilding poorly aligned solutions.' },
    { type: 'p', text: 'Strong communication is not a "soft skill" separate from delivery. It is one of the foundations of successful digital transformation.' },
    { type: 'h2', text: 'The Agile Manifesto Still Matters' },
    { type: 'p', text: 'Although digital delivery has evolved significantly over the years, the core ideas behind the Agile Alliance and the Agile Manifesto remain deeply relevant.' },
    { type: 'p', text: 'Particularly the emphasis on:' },
    { type: 'list', items: ['Individuals and interactions over processes and tools', 'Customer collaboration over contract negotiation', 'Responding to change over following a rigid plan'] },
    { type: 'p', text: 'For us, agile ways of working are not about ceremonies for the sake of process.' },
    { type: 'p', text: 'They are about creating healthier, more adaptive systems for collaboration and delivery.' },
    { type: 'p', text: 'Importantly, agile does not mean chaotic or directionless. It requires clarity, accountability, and trust.' },
    { type: 'p', text: 'When done well, agile working creates space for organisations to adapt thoughtfully without losing sight of long-term goals.' },
    { type: 'h2', text: 'Tried and Tested Frameworks Matter' },
    { type: 'p', text: 'A growth mindset does not mean reinventing everything from scratch.' },
    { type: 'p', text: 'Part of sustainable digital transformation is using frameworks and practices that have been proven to support collaboration and delivery effectively.' },
    { type: 'p', text: 'This can include:' },
    { type: 'list', items: ['Agile delivery frameworks', 'Service design methodologies', 'User-centred design practices', 'Retrospectives and reflection sessions', 'Cross-functional collaboration models', 'Accessibility standards', 'Continuous improvement cycles'] },
    { type: 'p', text: 'The value of frameworks is not rigid compliance.' },
    { type: 'p', text: 'The value is creating shared structures that help teams communicate, prioritise, and improve consistently.' },
    { type: 'p', text: 'At Studio Soren, we adapt frameworks carefully around the needs of organisations and users rather than forcing teams into overly rigid systems.' },
    { type: 'p', text: 'Processes should support people — not overwhelm them.' },
    { type: 'h2', text: 'Learning Together Creates Better Services' },
    { type: 'p', text: 'Some of the strongest digital partnerships happen when organisations embrace learning together.' },
    { type: 'p', text: 'That means:' },
    { type: 'list', items: ['Being honest about uncertainty', 'Testing ideas before scaling them', 'Listening to users continuously', 'Reflecting on what is working', 'Improving incrementally', 'Staying open to change'] },
    { type: 'p', text: 'Digital services are never truly finished.' },
    { type: 'p', text: 'Communities evolve. Technology changes. User expectations shift.' },
    { type: 'p', text: 'A growth mindset helps organisations remain responsive without becoming reactive.' },
    { type: 'p', text: 'Instead of chasing trends or constantly rebuilding systems, teams can make thoughtful improvements grounded in evidence and real human needs.' },
    { type: 'p', text: 'This creates more resilient services and healthier internal cultures.' },
    { type: 'h2', text: 'Designing With Care Means Designing for Change' },
    { type: 'p', text: 'Many organisations focus heavily on launch day.' },
    { type: 'p', text: 'But meaningful impact happens after launch.' },
    { type: 'p', text: 'Digital transformation should create systems that teams can continue learning from, adapting and improving over time.' },
    { type: 'p', text: 'That requires:' },
    { type: 'list', items: ['Clear governance', 'Strong collaboration', 'Shared ownership', 'Accessible design', 'Sustainable technology choices', 'Ongoing user insight', 'Long-term thinking'] },
    { type: 'p', text: 'The growth mindset supports this because it encourages progress over perfection.' },
    { type: 'p', text: 'It recognises that digital transformation is not a single event. It is an ongoing process of learning, improving and serving people more effectively.' },
    { type: 'h2', text: 'Final Thoughts' },
    { type: 'p', text: 'At Studio Soren, a growth mindset is not simply an internal value.' },
    { type: 'p', text: 'It shapes how we design, collaborate, communicate, and build partnerships.' },
    { type: 'p', text: 'We believe the best digital work happens when organisations:' },
    { type: 'list', items: ['Learn together', 'Involve users meaningfully', 'Communicate openly', 'Build trust intentionally', 'Take accountability with care', 'Stay adaptable without losing clarity'] },
    { type: 'p', text: 'Technology alone cannot create meaningful transformation. People do.' },
    { type: 'p', text: 'And when teams work with empathy, curiosity and shared purpose, digital services become more human, more effective, and more sustainable over time.' },
    { type: 'p', text: 'If your organisation is navigating digital transformation, improving services or looking for a collaborative long-term partner, we would love to talk.' },
  ];

  renderVals() {
    return {
      title: 'Why a Growth Mindset Matters in Digital Transformation',
      category: 'Research & Data',
      person: 'umay-hussain',
      date: '2026-06-14T00:00:00.000Z',
      minutes: '5',
      image: 'https://framerusercontent.com/images/nydBhrlzA7hkiUE0vdxj75LaR6U.png',
      imageAlt: 'A digital collage with the word GROWTH, featuring three people and floating chart icons.',
      extraProps: { blocks: this.blocks },
    };
  }
}
</script>
