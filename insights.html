  state = { activeCategory: 'All' };

  articles = [
    { slug: 'thoughtful-ai-for-real-organisations', title: 'The Future Is Already Here: Thoughtful AI for Real Organisations', category: 'AI Integration & Adoption', meta: 'How to integrate artificial intelligence into your daily workflows ethically, humanely, and in a way that actually scales for long-term impact.', minutes: '5', image: 'https://framerusercontent.com/images/aizBPUAS6VgXTqKG7k3av818.png', imageAlt: 'AI collage', href: '/insight-thoughtful-ai' },
    { slug: 'why-a-growth-mindset-matters-in-digital-transformation', title: 'Why a Growth Mindset Matters in Digital Transformation', category: 'Research & Data', meta: 'Technology is only half the battle. Discover why fostering an adaptable, learning-first culture within your team is the true driver of successful digital change.', minutes: '5', image: 'https://framerusercontent.com/images/nydBhrlzA7hkiUE0vdxj75LaR6U.png', imageAlt: 'Growth collage', href: '/insight-growth-mindset' },

    { slug: 'the-path-to-product-market-fit', title: "The path to product-market fit: A founder's guide to MVPs, scaling, and beyond", category: 'Software Engineering', meta: 'Learn the difference between Alpha and Beta stages, how to build a Minimum Viable Product (MVP), and professional strategies for scaling design and software.', minutes: '5', image: 'https://framerusercontent.com/images/a9TvCn7m5uPEVVepzABGMZ4KenI.png', imageAlt: 'MVP illustration', href: '/insight-product-market-fit' },
    { slug: 'design-strategy-for-enterprises', title: 'Design strategy for enterprises: Driving growth through operational excellence', category: 'Design Strategy', meta: 'Unlock growth and operational excellence with Design Strategy. Learn how Studio Soren helps large enterprises align business goals with user-centered innovation.', minutes: '3', image: 'https://framerusercontent.com/images/kEys52OiND88VpkYlxsEaXdNJw.jpg', imageAlt: '', href: '/insight-enterprise-design-strategy' },
    { slug: 'why-accessibility-standards-matter', title: 'Why accessibility standards matter in public sector design', category: 'Web & App Design', meta: 'Public services must work for everyone, regardless of ability, context, or circumstance. This is not only a legal requirement, but a moral and societal responsibility.', minutes: '3', image: 'https://framerusercontent.com/images/KuJSfSLquCNaw3PhVRO5uzY4BWU.png', imageAlt: 'GDS illustration', href: '/insight-accessibility-standards' },

    { slug: 'digital-storytelling-for-charities', title: 'Digital storytelling for charities: Turning data into understanding', category: 'Digital Storytelling', meta: 'In a tense fundraising and service environment, charities are under unprecedented pressure to communicate both what they do and why it matters.', minutes: '5', image: 'https://framerusercontent.com/images/Gwy9NxG76Ao5gQgolKMxPTgBeWs.jpg', imageAlt: '', href: '/insight-digital-storytelling-charities' },

    { slug: 'listening-before-launching', title: 'Listening before launching: Why co-design matters in the third sector', category: 'Design Strategy', meta: 'How designing with communities, not for them, leads to safer, more trusted services.', minutes: '2', image: 'https://framerusercontent.com/images/zxFhSDDzk7pv0oepgdBJIFQOz70.jpg', imageAlt: 'Group therapy meeting', href: '/insight-listening-before-launching' },
    { slug: 'community-effort-and-service-design', title: 'Designing for dignity: What community effort taught us about service design', category: 'Design Strategy', meta: "In the public and third sectors, the most effective digital services aren't built in isolation — they are grown from the ground up by the communities they serve.", minutes: '2', image: 'https://framerusercontent.com/images/Eo9UfnIwoggSQj0xpCghXuddw.jpg', imageAlt: '', href: '/insight-community-effort' },

      eyebrowStyle: { fontWeight: 600, fontSize: '13px', letterSpacing: '0.04em', color: accent, margin: '0 0 16px', textTransform: 'uppercase' },
