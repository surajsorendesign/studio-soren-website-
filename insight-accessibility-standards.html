<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  blocks = [
    { type: 'p', text: 'Public services must work for everyone, regardless of ability, context, or circumstance. This is not only a legal requirement — under the Public Sector Bodies Accessibility Regulations 2018 — but a moral and societal responsibility.' },
    { type: 'p', text: 'For leaders in public services, charities, and non-profits, accessibility directly impacts:' },
    { type: 'list', items: ['Service reach: Ensuring no one is excluded from essential support.', 'Operational efficiency: Fewer support requests and reduced "failure demand."', 'Public trust: Demonstrating fairness, dignity, and inclusion.', 'Risk reduction: Avoiding legal and reputational exposure.'] },
    { type: 'p', text: 'Accessibility is, fundamentally, good service design.' },
    { type: 'h2', text: 'What is WCAG 2.2 AA (in Plain English)?' },
    { type: 'p', text: 'WCAG stands for Web Content Accessibility Guidelines, an internationally recognised framework managed by the W3C Web Accessibility Initiative (WAI). It ensures digital products are usable by people with disabilities.' },
    { type: 'p', text: 'At the AA level (the standard for UK public sector bodies), your service must meet four core principles, often referred to as POUR: Perceivable, Operable, Understandable, and Robust.' },
    { type: 'p', text: 'This framework aligns perfectly with our philosophy of strategic clarity and service-first design.' },
    { type: 'h2', text: 'Our Approach: Accessibility as a Foundation, Not a Fix' },
    { type: 'p', text: 'We do not treat accessibility as a compliance task at the end of delivery. Instead, we integrate it from the initial discovery and strategy phases, guided by three principles:' },
    { type: 'h3', text: '1. Strategic Clarity' },
    { type: 'p', text: 'We simplify complexity so services are easy to navigate. By reducing cognitive load and using plain language, we ensure users are confident in knowing what to do next.' },
    { type: 'h3', text: '2. Serving with Care' },
    { type: 'p', text: 'Accessibility is an expression of respect. We design by listening with empathy to real people, prioritising usefulness over decoration.' },
    { type: 'h3', text: '3. Growth Mindset' },
    { type: 'p', text: 'Accessibility evolves. We continuously improve through user feedback and adapt to new technologies, treating every challenge as an opportunity to raise the bar for inclusive design practices.' },
    { type: 'h2', text: 'How We Deliver WCAG Compliance' },
    { type: 'h3', text: 'Step 1: Understand & Assess' },
    { type: 'list', items: ['Review services against WCAG 2.2 AA standards.', 'Identify accessibility and usability gaps.', 'Assess legal and operational risks.'] },
    { type: 'h3', text: 'Step 2: Define & Design with Clarity' },
    { type: 'p', text: 'We create strong, accessible foundations from the outset, using inclusive UX/UI patterns and human-centered design principles.' },
    { type: 'h3', text: 'Step 3: Build & Validate Accessibly' },
    { type: 'p', text: 'We ensure accessibility is carried through into delivery by testing with assistive technologies and real users. A product must be genuinely usable, not just compliant on paper.' },
    { type: 'h3', text: 'Step 4: Improve & Evolve Continuously' },
    { type: 'p', text: "Accessibility doesn't stop at launch. We monitor real-world usage and support long-term accessibility governance to ensure the service remains resilient." },
    { type: 'h2', text: 'Common Accessibility Challenges (and How We Solve Them)' },
    { type: 'list', items: ['"Our service is too complex to simplify" — We break complexity into clear, structured journeys.', '"Accessibility will limit design creativity" — Constraint leads to clarity; we follow the GOV.UK Design System for high-quality, accessible aesthetics.', '"We\'ll fix accessibility later" — Retrofitting is costly; we save you budget by designing it in from the start.'] },
    { type: 'h2', text: 'The Business Case for Accessibility' },
    { type: 'p', text: 'For leaders and decision-makers, accessibility is a strategic advantage. It leads to improved service efficiency, wider audience reach, and stronger public trust. It is the foundation of good digital governance.' },
    { type: 'h3', text: 'Accessibility as a Form of Service' },
    { type: 'p', text: 'At its core, accessibility is about serving people with care. This is critical in public services, where users may already be in high-stress situations. When we prioritise clarity and empathy, we create services that truly work for people.' },
    { type: 'h2', text: 'Ready to Improve Your Service?' },
    { type: 'p', text: "If you're looking for a practical starting point to improve your service's accessibility, we can help. Book a free 30-minute conversation with Suraj at Studio Soren to explore where you are today and how to move forward with confidence." },
  ];

  renderVals() {
    return {

      category: 'Web & App Design',

      date: '2026-04-15T00:00:00.000Z',

      imageAlt: 'GDS accessibility illustration',
      extraProps: { blocks: this.blocks },
    };
  }
}
