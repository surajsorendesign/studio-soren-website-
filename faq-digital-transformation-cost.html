</head>
<body>
<x-dc>
<dc-import name="ArticleDetail" title="{{ title }}" category="{{ category }}" person="{{ person }}" date="{{ date }}" minutes="{{ minutes }}" image="{{ image }}" image-alt="{{ imageAlt }}" dc-props="{{ extraProps }}" hint-size="100%,2000px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  blocks = [
    { type: 'h2', text: 'Beyond the Quote: Why the Best Digital Transformations Start Before the Contract' },
    { type: 'p', text: 'In the world of purpose-led design, a "ballpark figure" is often a disservice. At Studio Soren, we believe that if we haven\'t rolled up our sleeves to understand your organisation\u2019s friction points, we haven\'t earned the right to give you a price.' },
    { type: 'p', text: 'When you ask about the cost of digital transformation, you aren\u2019t just buying code; you are investing in a partnership. That is why our proposal process is intentionally rigorous, designed to provide value long before a single penny changes hands.' },
    { type: 'h2', text: 'We focus on a Value-First proposal process' },
    { type: 'p', text: 'We don\u2019t believe in "gatekeeping" expertise. Before you commit to a long-term project, we invest our own time and effort to ensure we are the right fit for your mission.' },
    { type: 'list', items: ['The Discovery Consultation: Every partnership begins with a free, high-intensity consultation. We don\'t just talk about features; we talk about your North Star and the human truths behind your service.', 'The Mini-Audit: As part of our proposal phase, we often perform a "light-touch" audit of your existing digital landscape. This identifies immediate quick wins and hidden technical debt that might otherwise derail a project later on.', 'Bespoke Recommendations: You won\u2019t receive a generic PDF. Our proposals include tailored recommendations on user research and service architecture, giving you a roadmap of what success looks like for your specific team.'] },
    { type: 'h3', text: 'Why We Invest So Much Upfront' },
    { type: 'p', text: 'You might wonder why we spend hours on audits and strategy before a contract is signed. The reason is simple: accuracy.' },
    { type: 'p', text: 'Research shows that digital programmes which lack clear focus and rigorous pre-planning are significantly more likely to fail — running over budget while delivering far less value than predicted when objectives are unclear. By doing the heavy lifting during our proposal stage, we eliminate the surprises and scope creep that plague cheaper, less thorough agencies.' },
    { type: 'quote', text: 'A conscientious partner helps you overcome entrepreneurial paralysis with meticulous analysis and active listening from day one. — Thomas Simmonds, Founder @ The Recovery Room' },
    { type: 'h3', text: 'A Partnership Rooted in Dignity' },
    { type: 'p', text: 'Our approach to digital storytelling and technical integration is built on dignity-first design. We respect your budget as much as we respect your users. By the time we present a formal proposal, you will have a clear understanding of the ROI, the timeline, and the human impact of the work.' },
    { type: 'p', text: 'We specialise in building user-friendly experiences for essential services. We know that for charities and social enterprises, every pound must be justified. Our proposal process is designed to give you the confidence that your investment is being handled with care and precision.' },
    { type: 'p', text: "Ready to start your free audit? Don't settle for a generic quote. Let's spend some time together looking at your current challenges and mapping out a way forward." },
    { type: 'p', text: 'Book a discovery call with Studio Soren today to begin our bespoke proposal process. No pressure, just high-impact strategy.' },
  ];

  renderVals() {
    return {
      title: 'How much does a typical digital transformation project cost?',
      category: 'FAQ · Cost',
      person: 'suraj-soren',
      date: '2026-04-18T00:00:00.000Z',
      minutes: '3',
      image: 'https://framerusercontent.com/images/jwEDOr7LEotaIK4V6X9Ge6SCA.png',
      imageAlt: 'Digital transformation cost',
      extraProps: { blocks: this.blocks },
    };
  }
}
</script>
</body>
</html>
