<x-dc>
<dc-import name="ArticleDetail" title="{{ title }}" category="{{ category }}" person="{{ person }}" date="{{ date }}" minutes="{{ minutes }}" image="{{ image }}" image-alt="{{ imageAlt }}" dc-props="{{ extraProps }}" hint-size="100%,2000px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  blocks = [
    { type: 'h3', text: 'Beyond Pixels: Why Your Business Needs Product Design, Not Just UI/UX' },
    { type: 'p', text: 'When companies decide to build a new app or overhaul an existing platform, the first instinct is usually to look for a "UI/UX designer". It makes sense on the surface — you want something that looks modern and feels smooth to navigate.' },
    { type: 'p', text: "However, many businesses end up disappointed. They receive beautiful wireframes and sleek interfaces, yet the final application fails to move the needle on conversions, clashes with the development team's capabilities, or misses the core business objectives entirely." },
    { type: 'p', text: 'The reason? They hired for traditional UI/UX layout, when what they actually needed was digital product design.' },
    { type: 'p', text: 'While these terms are often thrown around interchangeably as agency jargon, understanding the fundamental difference between them is the secret to building a digital asset that actually scales.' },
    { type: 'h2', text: 'The Traditional Lens: UI/UX Design' },
    { type: 'p', text: "Traditional UI/UX design is hyper-focused on the user's immediate interaction with a screen." },
    { type: 'list', items: ['UX (User Experience): Maps out the user journeys, designs information architecture, and creates wireframes to ensure a platform is intuitive.', 'UI (User Interface): Focuses on the visual identity — typography, colour palettes, button styling, and micro-animations that make an app beautiful.'] },
    { type: 'quote', text: 'The limitation: Traditional UI/UX often operates in a vacuum. It answers the question, "How can we make this specific feature easy and beautiful for the user?" But it rarely asks, "Should we be building this feature at all, and how does it make the business money?"' },
    { type: 'h2', text: 'The Wider Lens: Digital Product Design' },
    { type: 'p', text: 'Digital product design takes that essential UI/UX foundation and elevates it. It bridges the gap between design, engineering, and business strategy.' },
    { type: 'p', text: 'Rather than just mapping user journeys and building screen interfaces, a product designer takes a holistic view of the application as a living, commercial entity.' },
    { type: 'h3', text: '1. Blending Human-Centred Design with Business Goals' },
    { type: 'p', text: "A beautiful app is a failure if it doesn't solve a core business problem. Product design explicitly ensures that user satisfaction directly correlates with business growth — whether that means increasing retention, lowering customer acquisition costs, or boosting lifetime value." },
    { type: 'h3', text: '2. Upfront Technical Scoping' },
    { type: 'p', text: 'Product design integrates technical scoping from day one. By designing with APIs, databases, and structural constraints in mind, it eliminates friction and prevents costly redesigns down the line.' },
    { type: 'h3', text: '3. Securing Product-Market Fit' },
    { type: 'p', text: 'A product designer continuously asks hard questions about market positioning. They look at competitors, audit user data, and design the product to adapt to long-term market trends. They design an ecosystem, not just a static set of pages.' },
    { type: 'h2', text: 'Which One Does Studio Soren Practice?' },
    { type: 'p', text: "At Studio Soren, we don't just push pixels. Because our team handles both high-level design sprints and complex custom software development under one roof, our philosophy is rooted entirely in Product Design." },
    { type: 'p', text: 'When we partner with a client, we look through a wide-angle lens. We make sure your digital platform is visually stunning, compliant with strict WCAG accessibility standards, technically feasible for your engineers, and hardwired to hit your commercial targets.' },
    { type: 'p', text: "If you are ready to stop building generic screens and start engineering a digital product that drives real ROI, let's talk." },
  ];

  renderVals() {
    return {
      title: 'What is the difference between Product Design and traditional UX/UI design?',
      category: 'FAQ · Design',
      person: 'suraj-soren',
      date: '2026-05-01T00:00:00.000Z',
      minutes: '4',
      image: 'https://framerusercontent.com/images/a9TvCn7m5uPEVVepzABGMZ4KenI.png',
      imageAlt: 'Product design vs UX/UI',
      extraProps: { blocks: this.blocks },
    };
  }
}
</script>
