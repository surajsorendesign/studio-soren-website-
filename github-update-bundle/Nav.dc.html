<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav style="{{ navWrapStyle }}">
  <div style="{{ navStackStyle }}">
    <div style="{{ navInnerStyle }}">
      <a href="./Studio Soren Home.dc.html" style="{{ logoLinkStyle }}">
        <img src="./uploads/studio-soren-logo.svg" style="{{ logoImgStyle }}" alt="Studio Soren"/>
      </a>
      <div style="{{ navLinksStyle }}">
        <a href="./Studio Soren About.dc.html" style="{{ aboutStyle }}">About</a>
        <a href="./Studio Soren Case Studies.dc.html" style="{{ caseStudiesStyle }}">Case studies</a>
        <a href="./Studio Soren Services.dc.html" style="{{ servicesStyle }}">Services</a>
        <a href="./Studio Soren Insights.dc.html" style="{{ insightsStyle }}">Insights</a>
        <a href="./Studio Soren FAQs.dc.html" style="{{ faqsStyle }}">FAQs</a>
      </div>
      <div style="{{ navRightStyle }}">
        <button onClick="{{ toggleTheme }}" style="{{ themeToggleStyle }}" aria-label="Toggle theme">{{ themeIcon }}</button>
        <a href="https://calendly.com/suraj-studiosoren/30min" style="{{ navCtaStyle }}">Book a free call</a>
        <button onClick="{{ toggleNav }}" style="{{ hamburgerStyle }}" aria-label="Menu">{{ hamburgerIcon }}</button>
      </div>
    </div>
    <sc-if value="{{ mobileMenuOpen }}" hint-placeholder-val="{{ false }}">
      <div style="{{ mobileMenuStyle }}">
        <a href="./Studio Soren About.dc.html" style="{{ mobileNavLinkStyle }}">About</a>
        <a href="./Studio Soren Case Studies.dc.html" style="{{ mobileNavLinkStyle }}">Case studies</a>
        <a href="./Studio Soren Services.dc.html" style="{{ mobileNavLinkStyle }}">Services</a>
        <a href="./Studio Soren Insights.dc.html" style="{{ mobileNavLinkStyle }}">Insights</a>
        <a href="./Studio Soren FAQs.dc.html" style="{{ mobileNavLinkStyle }}">FAQs</a>
        <a href="https://calendly.com/suraj-studiosoren/30min" style="{{ mobileNavCtaStyle }}">Book a free call</a>
      </div>
    </sc-if>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1120,&quot;height&quot;:80},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;&quot;,&quot;about&quot;,&quot;case-studies&quot;,&quot;services&quot;,&quot;insights&quot;,&quot;faqs&quot;]}}">
class Component extends DCLogic {
  state = { navOpen: false, viewportWidth: typeof window !== 'undefined' ? window.innerWidth : 1200 };

  componentDidMount() {
    this.onResize = () => this.setState({ viewportWidth: window.innerWidth });
    window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
  }

  toggleTheme = () => {
    if (this.props.onThemeChange) this.props.onThemeChange();
  };
  toggleNav = () => this.setState((s) => ({ navOpen: !s.navOpen }));

  renderVals() {
    const dark = this.props.dark ?? true;
    const active = this.props.active ?? '';
    const isMobile = this.state.viewportWidth < 860;
    const accent = '#8B6CF5';
    const border = dark ? 'rgba(255,255,255,0.1)' : 'rgba(20,15,35,0.08)';
    const text = dark ? '#F3F1F9' : '#171325';
    const muted = dark ? '#A69FBE' : '#635C77';
    const fontBody = "'DM Sans', -apple-system, sans-serif";

    const linkStyle = { color: muted, textDecoration: 'none', fontSize: '14px', fontWeight: 500 };
    const activeStyle = { color: accent, textDecoration: 'none', fontSize: '14px', fontWeight: 700 };
    const styleFor = (key) => (active === key ? activeStyle : linkStyle);

    return {
      navWrapStyle: { position: 'sticky', top: '24px', zIndex: 50, display: 'flex', justifyContent: 'center', padding: '0 16px' },
      navStackStyle: { width: '100%', maxWidth: '1120px', display: 'flex', flexDirection: 'column', gap: '10px' },
      navInnerStyle: { display: 'flex', alignItems: 'center', gap: isMobile ? '12px' : '28px', width: '100%', padding: isMobile ? '10px 14px 10px 16px' : '12px 20px', borderRadius: '999px', background: dark ? 'rgba(20,16,32,0.65)' : 'rgba(255,255,255,0.72)', backdropFilter: 'blur(18px)', border: `1px solid ${border}`, boxShadow: dark ? '0 8px 32px rgba(0,0,0,0.35)' : '0 8px 32px rgba(20,15,35,0.08)' },
      logoLinkStyle: { display: 'flex', alignItems: 'center', marginRight: 'auto', textDecoration: 'none' },
      logoImgStyle: { height: '30px', width: 'auto', display: 'block', filter: dark ? 'brightness(0) invert(1)' : 'none' },
      navLinksStyle: { display: isMobile ? 'none' : 'flex', gap: '24px', flexWrap: 'wrap' },
      aboutStyle: styleFor('about'),
      caseStudiesStyle: styleFor('case-studies'),
      servicesStyle: styleFor('services'),
      insightsStyle: styleFor('insights'),
      faqsStyle: styleFor('faqs'),
      navRightStyle: { display: 'flex', alignItems: 'center', gap: '10px', marginLeft: isMobile ? 'auto' : 0 },
      themeToggleStyle: { width: '36px', height: '36px', borderRadius: '50%', border: `1px solid ${border}`, background: 'transparent', color: text, cursor: 'pointer', fontSize: '15px', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 },
      themeIcon: dark ? '☀' : '☾',
      navCtaStyle: { background: accent, color: '#fff', textDecoration: 'none', padding: '10px 18px', borderRadius: '999px', fontSize: '14px', fontWeight: 600, whiteSpace: 'nowrap', display: isMobile ? 'none' : 'inline-block' },
      hamburgerStyle: { display: isMobile ? 'flex' : 'none', width: '36px', height: '36px', borderRadius: '50%', border: `1px solid ${border}`, background: 'transparent', color: text, cursor: 'pointer', fontSize: '15px', alignItems: 'center', justifyContent: 'center', flexShrink: 0 },
      hamburgerIcon: this.state.navOpen ? '✕' : '☰',
      mobileMenuStyle: { display: 'flex', flexDirection: 'column', gap: '4px', padding: '14px', borderRadius: '20px', background: dark ? 'rgba(20,16,32,0.9)' : 'rgba(255,255,255,0.95)', backdropFilter: 'blur(18px)', border: `1px solid ${border}`, boxShadow: dark ? '0 8px 32px rgba(0,0,0,0.35)' : '0 8px 32px rgba(20,15,35,0.08)' },
      mobileNavLinkStyle: { color: text, textDecoration: 'none', fontSize: '15px', fontWeight: 500, padding: '10px 8px', borderRadius: '10px' },
      mobileNavCtaStyle: { background: accent, color: '#fff', textDecoration: 'none', padding: '12px 18px', borderRadius: '999px', fontSize: '14px', fontWeight: 600, textAlign: 'center', marginTop: '6px' },
      mobileMenuOpen: this.state.navOpen,
      toggleTheme: this.toggleTheme,
      toggleNav: this.toggleNav,
    };
  }
}
</script>
</body>
</html>
