<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ badgeWrapStyle }}">
  <img src="./uploads/founder-suraj.webp" alt="Suraj Soren" style="{{ badgeImgStyle }}"/>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:340},&quot;maxWidth&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;340px&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const maxWidth = this.props.maxWidth || '340px';
    return {
      badgeWrapStyle: { position: 'relative', width: '100%', maxWidth, aspectRatio: '1/1' },
      badgeImgStyle: { width: '100%', height: '100%', display: 'block', filter: 'drop-shadow(0 18px 34px rgba(0,0,0,0.4))' },
    };
  }
}
</script>
</body>
</html>
