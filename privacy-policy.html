<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Filson Soft'; src: url('./uploads/FilsonSoft-Bold.woff') format('woff'); font-weight: 700; font-style: normal; font-display: swap; }
  * { box-sizing: border-box; }
  body { margin: 0; -webkit-font-smoothing: antialiased; }
  a { color: #8B6CF5; }
  a:hover { color: #A78BFA; }
</style>
</helmet>

<div style="{{ pageStyle }}">
  <dc-import name="Nav" active="" dark="{{ true }}" hint-size="100%,64px"></dc-import>

  <header style="{{ heroSectionStyle }}">
    <p style="{{ eyebrowStyle }}">Legal</p>
    <h1 style="{{ h1Style }}">Privacy Policy</h1>
    <p style="{{ heroSubStyle }}">Last updated 8 February 2026</p>
  </header>

  <article style="{{ articleSectionStyle }}">
    <div style="{{ narrowStyle }}">
      <sc-for list="{{ blocks }}" as="b" hint-placeholder-count="20">
        <sc-if value="{{ b.isH3 }}" hint-placeholder-val="{{ false }}"><h3 style="{{ h3Style }}">{{ b.text }}</h3></sc-if>
        <sc-if value="{{ b.isP }}" hint-placeholder-val="{{ false }}"><p style="{{ paraStyle }}">{{ b.text }}</p></sc-if>
      </sc-for>
    </div>
  </article>

  <dc-import name="Footer" dark="{{ true }}" hint-size="100%,320px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  blocks = [
    { type: 'p', text: 'This Privacy Policy explains how Studio Soren Ltd ("we," "us," or "our") collects, uses, and protects the personal data of visitors to our website, studiosoren.com, and individuals who engage with our services. We are committed to protecting your privacy in accordance with the UK General Data Protection Regulation (GDPR) and the Data Protection Act 2018.' },
    { type: 'h3', text: 'Who we are' },
    { type: 'p', text: 'Studio Soren Ltd is the data controller responsible for your personal data. We are a limited company registered in England and Wales.' },
    { type: 'h3', text: 'The data we collect' },
    { type: 'p', text: 'We may collect and process the following types of personal data:' },
    { type: 'p', text: 'Identity Data: Your name, company name, and job title.' },
    { type: 'p', text: 'Contact Data: Your email address, phone number, and physical address.' },
    { type: 'p', text: 'Technical Data: Your IP address, browser type and version, time zone setting, browser plug-in types, and operating system.' },
    { type: 'p', text: 'Usage Data: Information about how you use our website, products, and services.' },
    { type: 'p', text: 'Marketing and Communications Data: Your preferences in receiving marketing from us.' },
    { type: 'h3', text: 'How we collect your data' },
    { type: 'p', text: 'We collect data through:' },
    { type: 'p', text: 'Direct Interactions: When you fill out forms on our website, email us, or contact us via phone.' },
    { type: 'p', text: 'Automated Technologies: As you interact with our website, we may automatically collect Technical and Usage Data through cookies and similar technologies.' },
    { type: 'p', text: 'Third Parties: We may receive personal data from third parties like analytics providers (e.g., Google Analytics).' },
    { type: 'h3', text: 'How we use your data' },
    { type: 'p', text: 'We will only use your personal data when we have a lawful basis to do so under GDPR. The primary purposes for which we use your data include:' },
    { type: 'p', text: 'To Respond to Inquiries: To respond to your requests for information about our services (our legitimate interest).' },
    { type: 'p', text: 'To Send Communications: To send you our newsletter or marketing communications, where you have provided your consent.' },
    { type: 'p', text: 'To Improve Our Services: To analyse how our website is used and make improvements (our legitimate interest).' },
    { type: 'p', text: 'To Fulfil Contracts: To perform a contract we have with you.' },
    { type: 'h3', text: 'Data sharing' },
    { type: 'p', text: 'We do not sell your personal data. We may share your data with third parties that help us operate our business, such as:' },
    { type: 'p', text: 'Service Providers: Companies that provide us with cloud hosting, email marketing, or website analytics services.' },
    { type: 'p', text: 'Legal Authorities: Where required by law, we may disclose your personal data to government or law enforcement agencies.' },
    { type: 'h3', text: 'Data security and retention' },
    { type: 'p', text: 'Your data is secure in our Google Workspace cloud environment. We will retain your personal data only for as long as necessary to fulfil the purposes for which we collected it.' },
    { type: 'h3', text: 'Your legal rights' },
    { type: 'p', text: 'Under GDPR, you have the following rights regarding your personal data:' },
    { type: 'p', text: 'The right to be informed about how your data is being used.' },
    { type: 'p', text: 'The right to access your personal data.' },
    { type: 'p', text: 'The right to rectification of inaccurate data.' },
    { type: 'p', text: 'The right to erasure of your data.' },
    { type: 'p', text: 'The right to restrict processing of your data.' },
    { type: 'p', text: 'The right to data portability to another service.' },
    { type: 'p', text: 'The right to object to the processing of your data.' },
    { type: 'p', text: 'The right to withdraw consent at any time.' },
    { type: 'h3', text: 'Cookies' },
    { type: 'p', text: 'Our website uses cookies to distinguish you from other users. This helps us provide you with a good experience and allows us to improve our site. You can set your browser to refuse all or some cookies or to alert you when websites set or access cookies. See our Cookies Policy for more detail.' },
    { type: 'h3', text: 'Contact us' },
    { type: 'p', text: 'If you have any questions about this privacy policy or wish to exercise your legal rights, please contact us at hello@studiosoren.com.' },
  ];

  renderVals() {
    const accent = '#8B6CF5', bg = '#0C0A12', text = '#F3F1F9', muted = '#A69FBE';
    const fontDisplay = "'Filson Soft', 'Fraunces', Georgia, serif", fontBody = "'DM Sans', -apple-system, sans-serif";
    const blocks = this.blocks.map((b) => ({ ...b, isH3: b.type === 'h3', isP: b.type === 'p' }));
    return {
      pageStyle: { background: bg, color: text, fontFamily: fontBody, minHeight: '100vh', paddingTop: '16px' },
      heroSectionStyle: { padding: '72px 24px 12px', maxWidth: '720px', margin: '0 auto', textAlign: 'center' },
      eyebrowStyle: { fontWeight: 600, fontSize: '13px', letterSpacing: '0.04em', color: accent, margin: '0 0 16px', textTransform: 'uppercase' },
      h1Style: { fontFamily: fontDisplay, fontSize: '40px', lineHeight: 1.15, fontWeight: 700, margin: '0 0 12px' },
      heroSubStyle: { fontSize: '14px', color: muted, margin: 0 },
      articleSectionStyle: { padding: '32px 24px 24px' },
      narrowStyle: { maxWidth: '720px', margin: '0 auto' },
      h3Style: { fontFamily: fontDisplay, fontSize: '21px', lineHeight: 1.35, fontWeight: 700, margin: '32px 0 14px' },
      paraStyle: { fontSize: '16px', lineHeight: 1.8, color: muted, margin: '0 0 18px' },
      blocks,
    };
  }
}
</script>
</body>
</html>
