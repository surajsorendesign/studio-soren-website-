<div style="{{ pageStyle }}">
  <dc-import name="Nav" active="" dark="{{ dark }}" on-theme-change="{{ toggleTheme }}" hint-size="100%,64px"></dc-import>

  <header style="{{ heroSectionStyle }}">
    <p style="{{ eyebrowStyle }}">Legal</p>
    <h1 style="{{ h1Style }}">Cookies Policy</h1>
  </header>

  <article style="{{ articleSectionStyle }}">
    <div style="{{ narrowStyle }}">
      <sc-for list="{{ blocks }}" as="b" hint-placeholder-count="12">
        <sc-if value="{{ b.isH3 }}" hint-placeholder-val="{{ false }}"><h3 style="{{ h3Style }}">{{ b.text }}</h3></sc-if>
        <sc-if value="{{ b.isP }}" hint-placeholder-val="{{ false }}"><p style="{{ paraStyle }}">{{ b.text }}</p></sc-if>
        <sc-if value="{{ b.isList }}" hint-placeholder-val="{{ false }}">
          <ul style="{{ listStyle }}">
            <sc-for list="{{ b.items }}" as="li" hint-placeholder-count="3">
              <li style="{{ listItemStyle }}">{{ li }}</li>
            </sc-for>
          </ul>
        </sc-if>
      </sc-for>
    </div>
  </article>

  <dc-import name="Footer" dark="{{ dark }}" hint-size="100%,320px"></dc-import>
</div>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  theme0 = (typeof localStorage !== 'undefined' && localStorage.getItem('soren-theme') === 'light') ? 'light' : 'dark';
  toggleTheme = () => { this.setState((s) => { const next = (s.theme || this.theme0) === 'dark' ? 'light' : 'dark'; if (typeof localStorage !== 'undefined') localStorage.setItem('soren-theme', next); return { theme: next }; }); };
  blocks = [
    { type: 'p', text: 'This Cookie Policy explains how Studio Soren ("we", "us", and "our") uses cookies and similar technologies to recognise you when you visit our website. It explains what these technologies are and why we use them, as well as your rights to control our use of them.' },
    { type: 'h3', text: 'What are cookies?' },
    { type: 'p', text: 'Cookies are small data files that are placed on your computer or mobile device when you visit a website. They are widely used by website owners to make their platforms work, or to work more efficiently, as well as to provide reporting information.' },
    { type: 'h3', text: 'Why we use cookies' },
    { type: 'p', text: 'We use first-party and third-party cookies for several reasons. Some cookies are required for technical reasons in order for our website to operate (we refer to these as "essential" or "strictly necessary" cookies). Other cookies enable us to track and target the interests of our users to enhance the experience on our site.' },
    { type: 'h3', text: 'Types of cookies we use' },
    { type: 'p', text: 'We categorise our cookies into the following groups:' },
    { type: 'list', items: [
      'Strictly Necessary Cookies: These are essential for you to browse the website and use its features. The website cannot function properly without these.',
      'Performance & Analytics Cookies: These cookies collect information about how you use our website, such as which pages you visit most often. We typically use Google Analytics for this. All information is aggregated and anonymous.',
      'Functionality Cookies: These allow our website to remember choices you make (such as your language or region) to provide more personal features.',
      'Marketing & Targeting Cookies: These cookies are used to deliver content more relevant to you and your interests. They help measure the effectiveness of advertising and branding campaigns.',
    ] },
    { type: 'h3', text: 'Specific third-party cookies' },
    { type: 'p', text: 'Given our services in UX/UI and digital strategy, we may use third-party tools that set cookies, including:' },
    { type: 'list', items: [
      'Google Analytics: To understand how visitors engage with our design portfolio and services.',
      'Hosting Providers: To ensure the stability and security of the site architecture.',
      'Booking Tools: If you use our site to book a discovery call, these tools may set cookies to manage the appointment process.',
    ] },
    { type: 'h3', text: 'How to control cookies' },
    { type: 'p', text: 'You have the right to decide whether to accept or reject cookies.' },
    { type: 'list', items: [
      'Cookie Consent Manager: You can exercise your preferences via our on-site cookie banner or settings link.',
      'Browser Controls: You can set or amend your web browser controls to accept or refuse cookies. If you choose to reject cookies, you may still use our website, though some functionality may be restricted.',
      'Opting Out: Most advertising networks offer you a way to opt out of targeted adverts.',
    ] },
    { type: 'h3', text: 'Updates to this policy' },
    { type: 'p', text: 'We may update this Cookie Policy from time to time to reflect changes to the cookies we use or for other operational, legal, or regulatory reasons. Please re-visit this policy regularly to stay informed.' },
    { type: 'h3', text: 'Contact us' },
    { type: 'p', text: 'If you have any questions about our use of cookies or other technologies, please reach out to us: hello@studiosoren.com' },
  ];

  renderVals() {
    const dark = (this.state.theme || this.theme0) !== 'light';
    const accent = '#8B6CF5', bg = dark ? '#0C0A12' : '#FAF9FC', border = dark ? 'rgba(255,255,255,0.1)' : 'rgba(20,15,35,0.08)', text = dark ? '#F3F1F9' : '#171325', muted = dark ? '#A69FBE' : '#635C77';
    const fontDisplay = "'Filson Soft', 'Fraunces', Georgia, serif", fontBody = "'DM Sans', -apple-system, sans-serif";
    const blocks = this.blocks.map((b) => ({ ...b, isH3: b.type === 'h3', isP: b.type === 'p', isList: b.type === 'list' }));
    return {
      dark,
      toggleTheme: this.toggleTheme,
      pageStyle: { animation: 'soren-page-in .5s ease both', background: bg, color: text, fontFamily: fontBody, minHeight: '100vh', paddingTop: '24px' },
      heroSectionStyle: { padding: '72px 24px 24px', maxWidth: '720px', margin: '0 auto', textAlign: 'center' },
      eyebrowStyle: { fontWeight: 600, fontSize: '13px', letterSpacing: '0.04em', color: accent, margin: '0 0 16px', textTransform: 'uppercase' },
      h1Style: { fontFamily: fontDisplay, fontSize: '40px', lineHeight: 1.15, fontWeight: 700, margin: 0 },
      articleSectionStyle: { padding: '32px 24px 24px' },
      narrowStyle: { maxWidth: '720px', margin: '0 auto' },
      h3Style: { fontFamily: fontDisplay, fontSize: '21px', lineHeight: 1.35, fontWeight: 700, margin: '32px 0 14px' },
      paraStyle: { fontSize: '16px', lineHeight: 1.8, color: muted, margin: '0 0 18px' },
      listStyle: { margin: '0 0 18px', padding: '0 0 0 20px' },
      listItemStyle: { fontSize: '16px', lineHeight: 1.8, color: muted, marginBottom: '8px' },
      blocks,
    };
  }
}
</script>
